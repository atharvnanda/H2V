<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H2V — Horizontal to Vertical</title>
  <meta name="description" content="Automated horizontal-to-vertical video converter for broadcast news content." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d11;
      --surface:   rgba(255 255 255 / 0.04);
      --glass:     rgba(255 255 255 / 0.06);
      --border:    rgba(255 255 255 / 0.08);
      --text:      #e4e6eb;
      --text-dim:  #8b8fa3;
      --accent:    #6c5ce7;
      --accent-2:  #a29bfe;
      --danger:    #ff6b6b;
      --success:   #51cf66;
      --radius:    14px;
      --font:      'Inter', system-ui, -apple-system, sans-serif;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Ambient background glow ──────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 25% 20%, rgba(108,92,231,.12), transparent),
        radial-gradient(ellipse 500px 350px at 75% 75%, rgba(162,155,254,.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card container ───────────────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      width: min(480px, 92vw);
      background: var(--glass);
      backdrop-filter: blur(32px) saturate(1.2);
      -webkit-backdrop-filter: blur(32px) saturate(1.2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      transition: transform .35s ease, box-shadow .35s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 48px rgba(0,0,0,.45); }

    /* ── Logo / Title ─────────────────────────────────────────────────────── */
    .logo {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: .35rem;
    }
    .subtitle {
      font-size: .82rem;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }

    /* ── View states ──────────────────────────────────────────────────────── */
    .view { display: none; flex-direction: column; align-items: center; gap: 1.2rem; }
    .view.active { display: flex; animation: fadeIn .4s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Upload drop zone ─────────────────────────────────────────────────── */
    .dropzone {
      width: 100%;
      padding: 2.4rem 1.5rem;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .25s, background .25s;
      position: relative;
      overflow: hidden;
    }
    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(108,92,231,.06);
    }
    .dropzone-icon {
      font-size: 2.2rem;
      margin-bottom: .6rem;
      opacity: .7;
    }
    .dropzone-label {
      font-size: .92rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .dropzone-label strong {
      color: var(--accent-2);
      font-weight: 600;
    }
    .file-name {
      margin-top: .5rem;
      font-size: .82rem;
      color: var(--accent-2);
      word-break: break-all;
      min-height: 1.2em;
    }
    input[type="file"] { display: none; }

    /* ── Button ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .72rem 2rem;
      font-family: var(--font);
      font-size: .88rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 16px rgba(108,92,231,.25);
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent-2);
      box-shadow: none;
    }
    .btn-outline:hover { background: rgba(108,92,231,.1); }

    /* ── Spinner ──────────────────────────────────────────────────────────── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }

    .spinner {
      width: 52px; height: 52px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-size: .92rem;
      color: var(--text-dim);
      transition: color .3s;
    }

    /* ── Done view ────────────────────────────────────────────────────────── */
    .done-icon {
      font-size: 2.5rem;
      color: var(--success);
      animation: popIn .4s ease;
    }
    @keyframes popIn { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .video-preview {
      width: 100%;
      max-height: 420px;
      border-radius: 10px;
      background: #000;
      margin-top: .4rem;
    }

    .btn-group { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }

    /* ── Tabs style ───────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: rgba(255 255 255 / 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.5rem;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    
    .mode-content {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 1.2rem;
    }
    .mode-content.active {
      display: flex;
    }

    /* ── Input forms style ─────────────────────────────────────────────────── */
    .input-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
      width: 100%;
      text-align: left;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.88rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.25);
    }

    /* ── Double range trimmer slider style ────────────────────────────────── */
    .trimmer-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1rem;
      margin: 0.25rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .range-slider {
      position: relative;
      width: 100%;
      height: 6px;
      margin: 10px 0;
    }
    .slider-track {
      position: absolute;
      height: 100%;
      background: rgba(255 255 255 / 0.1);
      border-radius: 3px;
      width: 100%;
      top: 0;
      z-index: 1;
    }
    .range-slider input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      top: 0;
      left: 0;
      z-index: 2;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid var(--accent);
      cursor: pointer;
      pointer-events: auto;
      -webkit-appearance: none;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .range-slider input[type="range"]::-moz-range-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid var(--accent);
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .range-slider input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.2);
    }
    .trim-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .trim-legend span {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Error state ──────────────────────────────────────────────────────── */
    .error-text { color: var(--danger); font-size: .88rem; line-height: 1.5; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .card { padding: 2rem 1.25rem; }
      .dropzone { padding: 1.8rem 1rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">H2V</div>
  <div class="subtitle">Horizontal → Vertical Video Converter</div>

  <!-- ────── Upload View ────── -->
  <div id="view-upload" class="view active">
    <!-- Tabs toggler -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-upload">Upload File</button>
      <button class="tab-btn" id="tab-live">Livestream Cut</button>
    </div>

    <!-- Upload Mode -->
    <div id="mode-upload" class="mode-content active">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📁</div>
        <div class="dropzone-label">
          Drag & drop your video here<br/>or <strong>click to browse</strong>
        </div>
        <input type="file" id="file-input" accept="video/*" />
      </div>
      <div class="file-name" id="file-name"></div>
      <button class="btn" id="btn-upload" disabled style="width: 100%;">
        <span>⬆</span> Convert Video
      </button>
    </div>

    <!-- Livestream Cut Mode -->
    <div id="mode-live" class="mode-content">
      <div class="input-group">
        <label for="live-url">YouTube Livestream URL</label>
        <input type="text" id="live-url" placeholder="https://www.youtube.com/watch?v=..." />
      </div>
      <div class="input-row">
        <div class="input-group">
          <label for="live-time-ago">Time Ago (e.g. 5m, 120s)</label>
          <input type="text" id="live-time-ago" placeholder="e.g. 2m" />
        </div>
        <div class="input-group">
          <label for="live-duration">Duration (seconds)</label>
          <input type="number" id="live-duration" placeholder="e.g. 30" min="5" value="30" />
        </div>
      </div>
      <button class="btn" id="btn-live-cut" style="width: 100%; margin-top: 0.4rem;">
        <span>✂</span> Extract Clip
      </button>
    </div>
  </div>

  <!-- ────── Review View ────── -->
  <div id="view-review" class="view">
    <div class="logo" style="font-size: 0.95rem; margin-bottom: 0;">Review Extracted Clip</div>
    <div class="subtitle" style="font-size: 0.78rem; margin-bottom: 0.5rem;">Trim the clip before vertical conversion</div>
    
    <video id="review-video" class="video-preview" controls playsinline style="max-height: 220px;"></video>
    
    <div class="trimmer-container">
      <div class="range-slider">
        <div class="slider-track" id="slider-track"></div>
        <input type="range" id="trim-start" min="0" max="100" step="0.1" value="0">
        <input type="range" id="trim-end" min="0" max="100" step="0.1" value="100">
      </div>
      <div class="trim-legend">
        <div>Start: <span id="trim-start-label">0.0</span>s</div>
        <div>End: <span id="trim-end-label">30.0</span>s</div>
        <div>Duration: <span id="trim-duration-label">30.0</span>s</div>
      </div>
    </div>
    
    <div class="btn-group" style="width: 100%;">
      <button class="btn btn-outline" id="btn-review-back" style="flex: 1;">
        <span>←</span> Back
      </button>
      <button class="btn" id="btn-review-confirm" style="flex: 2;">
        <span>✓</span> Confirm & Convert
      </button>
    </div>
  </div>

  <!-- ────── Loading View ────── -->
  <div id="view-loading" class="view">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="status-text" id="status-text">Queued — starting pipeline…</div>
    </div>
  </div>

  <!-- ────── Done View ────── -->
  <div id="view-done" class="view">
    <div class="done-icon">✓</div>
    <video id="video-preview" class="video-preview" controls playsinline></video>
    <div class="btn-group">
      <a id="btn-download" class="btn" download>
        <span>⬇</span> Download
      </a>
      <button class="btn btn-outline" id="btn-new">
        <span>↻</span> Convert another
      </button>
    </div>
  </div>

  <!-- ────── Error View ────── -->
  <div id="view-error" class="view">
    <div class="done-icon" style="color: var(--danger);">✗</div>
    <div class="error-text" id="error-text">Something went wrong.</div>
    <button class="btn btn-outline" id="btn-retry">
      <span>↻</span> Try again
    </button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ── Elements ─────────────────────────────────────────────────────────────
  const views           = document.querySelectorAll('.view');
  const dropzone        = document.getElementById('dropzone');
  const fileInput       = document.getElementById('file-input');
  const fileName        = document.getElementById('file-name');
  const btnUpload       = document.getElementById('btn-upload');
  const statusTxt       = document.getElementById('status-text');
  const videoEl         = document.getElementById('video-preview');
  const btnDL           = document.getElementById('btn-download');
  const btnNew          = document.getElementById('btn-new');
  const btnRetry        = document.getElementById('btn-retry');
  const errorTxt        = document.getElementById('error-text');

  // New Live Cut Tabs & Inputs
  const tabUpload       = document.getElementById('tab-upload');
  const tabLive         = document.getElementById('tab-live');
  const modeUpload      = document.getElementById('mode-upload');
  const modeLive        = document.getElementById('mode-live');
  const liveUrlInput    = document.getElementById('live-url');
  const liveTimeInput   = document.getElementById('live-time-ago');
  const liveDurInput    = document.getElementById('live-duration');
  const btnLiveCut      = document.getElementById('btn-live-cut');

  // Review screen
  const reviewVideo      = document.getElementById('review-video');
  const sliderTrack      = document.getElementById('slider-track');
  const trimStartInput   = document.getElementById('trim-start');
  const trimEndInput     = document.getElementById('trim-end');
  const trimStartLabel   = document.getElementById('trim-start-label');
  const trimEndLabel     = document.getElementById('trim-end-label');
  const trimDurationLabel= document.getElementById('trim-duration-label');
  const btnReviewBack    = document.getElementById('btn-review-back');
  const btnReviewConfirm = document.getElementById('btn-review-confirm');

  let selectedFile       = null;
  let pollTimer          = null;
  let currentLiveCutId   = null;
  let requestedDuration  = 30.0;

  // ── View management ──────────────────────────────────────────────────────
  function showView(id) {
    views.forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── Tabs selection ───────────────────────────────────────────────────────
  tabUpload.addEventListener('click', () => {
    tabUpload.classList.add('active');
    tabLive.classList.remove('active');
    modeUpload.classList.add('active');
    modeLive.classList.remove('active');
  });

  tabLive.addEventListener('click', () => {
    tabLive.classList.add('active');
    tabUpload.classList.remove('active');
    modeLive.classList.add('active');
    modeUpload.classList.remove('active');
  });

  // ── Time Ago Parsing Helper ──────────────────────────────────────────────
  function parseTimeAgo(str) {
    str = str.trim().toLowerCase();
    if (!str) return 0;
    
    const match = str.match(/^(\d+(?:\.\d+)?)\s*([hms])?$/);
    if (!match) {
      const val = parseFloat(str);
      return isNaN(val) ? 0 : val;
    }
    
    const num = parseFloat(match[1]);
    const unit = match[2];
    
    if (unit === 'h') return num * 3600;
    if (unit === 'm') return num * 60;
    if (unit === 's') return num;
    return num;
  }

  // ── Double Range Slider Logic ────────────────────────────────────────────
  function updateSliderTrack() {
    const minVal = parseFloat(trimStartInput.value);
    const maxVal = parseFloat(trimEndInput.value);
    const maxLimit = parseFloat(trimStartInput.max) || 100;
    
    const percentStart = (minVal / maxLimit) * 100;
    const percentEnd = (maxVal / maxLimit) * 100;
    
    sliderTrack.style.background = `linear-gradient(to right, 
      rgba(255, 255, 255, 0.1) ${percentStart}%, 
      var(--accent) ${percentStart}%, 
      var(--accent) ${percentEnd}%, 
      rgba(255, 255, 255, 0.1) ${percentEnd}%)`;
  }

  trimStartInput.addEventListener('input', () => {
    let valStart = parseFloat(trimStartInput.value);
    let valEnd = parseFloat(trimEndInput.value);
    
    if (valStart >= valEnd - 0.5) {
      trimStartInput.value = valEnd - 0.5;
      valStart = valEnd - 0.5;
    }
    
    trimStartLabel.textContent = valStart.toFixed(1);
    trimDurationLabel.textContent = (valEnd - valStart).toFixed(1);
    updateSliderTrack();
    
    reviewVideo.currentTime = valStart;
  });

  trimEndInput.addEventListener('input', () => {
    let valStart = parseFloat(trimStartInput.value);
    let valEnd = parseFloat(trimEndInput.value);
    
    if (valEnd <= valStart + 0.5) {
      trimEndInput.value = valStart + 0.5;
      valEnd = valStart + 0.5;
    }
    
    trimEndLabel.textContent = valEnd.toFixed(1);
    trimDurationLabel.textContent = (valEnd - valStart).toFixed(1);
    updateSliderTrack();
    
    reviewVideo.currentTime = valEnd;
  });

  reviewVideo.addEventListener('loadedmetadata', () => {
    const dur = reviewVideo.duration || requestedDuration;
    trimStartInput.max = dur;
    trimEndInput.max = dur;
    trimStartInput.value = 0;
    trimEndInput.value = dur;
    trimStartLabel.textContent = "0.0";
    trimEndLabel.textContent = dur.toFixed(1);
    trimDurationLabel.textContent = dur.toFixed(1);
    updateSliderTrack();
  });

  // ── Drag & drop ──────────────────────────────────────────────────────────
  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('drag-over');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) selectFile(fileInput.files[0]);
  });

  function selectFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    btnUpload.disabled = false;
  }

  // ── Upload Local File ────────────────────────────────────────────────────
  btnUpload.addEventListener('click', async () => {
    if (!selectedFile) return;
    btnUpload.disabled = true;
    showView('view-loading');
    statusTxt.textContent = 'Uploading…';

    try {
      const form = new FormData();
      form.append('file', selectedFile);

      const res = await fetch('/upload', { method: 'POST', body: form });
      if (!res.ok) throw new Error(`Upload failed (${res.status})`);

      const { job_id } = await res.json();
      startPolling(job_id, '/status');
    } catch (err) {
      showError(err.message);
    }
  });

  // ── Livestream Cut Request ────────────────────────────────────────────────
  btnLiveCut.addEventListener('click', async () => {
    const url = liveUrlInput.value.trim();
    const timeAgoStr = liveTimeInput.value.trim();
    const duration = parseFloat(liveDurInput.value);

    if (!url) {
      alert("Please enter a valid YouTube livestream URL.");
      return;
    }
    if (!timeAgoStr) {
      alert("Please specify how far back to cut from (e.g. 5m or 120s).");
      return;
    }
    if (isNaN(duration) || duration < 5) {
      alert("Please specify a duration of at least 5 seconds.");
      return;
    }

    const secondsAgo = parseTimeAgo(timeAgoStr);
    requestedDuration = duration;

    showView('view-loading');
    statusTxt.textContent = 'Initializing livestream clip extraction…';

    try {
      const res = await fetch('/live-cut', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, seconds_ago: secondsAgo, duration })
      });

      if (!res.ok) throw new Error(`Live cut request failed (${res.status})`);

      const { job_id } = await res.json();
      startPollingLiveCut(job_id);
    } catch (err) {
      showError(err.message);
    }
  });

  // ── Polling live cut status ──────────────────────────────────────────────
  function startPollingLiveCut(jobId) {
    if (pollTimer) clearInterval(pollTimer);

    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`/live-cut/status/${jobId}`);
        if (!res.ok) throw new Error(`Live cut status check failed (${res.status})`);

        const data = await res.json();
        statusTxt.textContent = data.detail || 'Extracting livestream clip…';

        if (data.state === 'done') {
          clearInterval(pollTimer);
          pollTimer = null;
          currentLiveCutId = jobId;
          
          // Serve the extracted clip in the Review screen
          reviewVideo.src = data.output_url;
          showView('view-review');
        } else if (data.state === 'error') {
          clearInterval(pollTimer);
          pollTimer = null;
          showError(data.detail);
        }
      } catch (err) {
        clearInterval(pollTimer);
        pollTimer = null;
        showError(err.message);
      }
    }, 2000);
  }

  // ── Review Screen Interactions ───────────────────────────────────────────
  btnReviewBack.addEventListener('click', () => {
    reviewVideo.pause();
    reviewVideo.src = '';
    showView('view-upload');
  });

  btnReviewConfirm.addEventListener('click', async () => {
    reviewVideo.pause();
    const trimStart = parseFloat(trimStartInput.value);
    const trimEnd = parseFloat(trimEndInput.value);

    showView('view-loading');
    statusTxt.textContent = 'Trimming video & analyzing structure…';

    try {
      const res = await fetch('/process-vertical', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          video_id: currentLiveCutId,
          trim_start: trimStart,
          trim_end: trimEnd
        })
      });

      if (!res.ok) throw new Error(`Vertical processing request failed (${res.status})`);

      const { job_id } = await res.json();
      startPolling(job_id, '/status');
    } catch (err) {
      showError(err.message);
    }
  });

  // ── Polling Standard Job status ──────────────────────────────────────────
  function startPolling(jobId, endpointPrefix) {
    if (pollTimer) clearInterval(pollTimer);

    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`${endpointPrefix}/${jobId}`);
        if (!res.ok) throw new Error(`Status check failed (${res.status})`);

        const data = await res.json();
        statusTxt.textContent = data.detail || 'Processing…';

        if (data.state === 'done') {
          clearInterval(pollTimer);
          pollTimer = null;
          showDone(data.output_url);
        } else if (data.state === 'error') {
          clearInterval(pollTimer);
          pollTimer = null;
          showError(data.detail);
        }
      } catch (err) {
        clearInterval(pollTimer);
        pollTimer = null;
        showError(err.message);
      }
    }, 2500);
  }

  // ── Done ─────────────────────────────────────────────────────────────────
  function showDone(url) {
    videoEl.src = url;
    btnDL.href = url;
    showView('view-done');
  }

  // ── Error ────────────────────────────────────────────────────────────────
  function showError(msg) {
    errorTxt.textContent = msg || 'An unexpected error occurred.';
    showView('view-error');
  }

  // ── Reset ────────────────────────────────────────────────────────────────
  function reset() {
    selectedFile = null;
    fileInput.value = '';
    fileName.textContent = '';
    btnUpload.disabled = true;
    videoEl.src = '';
    reviewVideo.src = '';
    currentLiveCutId = null;
    showView('view-upload');
  }

  btnNew.addEventListener('click', reset);
  btnRetry.addEventListener('click', reset);
})();
</script>
